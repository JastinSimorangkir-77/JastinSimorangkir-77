<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Jastin Simorangkir - Junior Web and Mobile Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="1000" height="260" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Latar belakang -->
    <rect width="1000" height="260" fill="url(#bg)"/>

    <!-- Lingkaran cahaya bergerak -->
    <circle cx="150" cy="60" r="95" fill="#38BDF8" opacity="0.12">
      <animate attributeName="cx" values="150;240;150" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;120;60" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="200" r="110" fill="#A78BFA" opacity="0.12">
      <animate attributeName="cx" values="860;760;860" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;130;200" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- Simbol kode melayang -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#38BDF8" opacity="0.35">
      <text x="70" y="240">&lt;/&gt;
        <animate attributeName="y" values="250;30;250" dur="14s" repeatCount="indefinite"/>
      </text>
      <text x="230" y="240">{ }
        <animate attributeName="y" values="250;30;250" dur="17s" begin="-5s" repeatCount="indefinite"/>
      </text>
      <text x="780" y="240">=&gt;
        <animate attributeName="y" values="250;30;250" dur="15s" begin="-3s" repeatCount="indefinite"/>
      </text>
      <text x="900" y="240">;
        <animate attributeName="y" values="250;30;250" dur="12s" begin="-8s" repeatCount="indefinite"/>
      </text>
      <text x="620" y="240">[ ]
        <animate attributeName="y" values="250;30;250" dur="18s" begin="-10s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Nama -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="500" y="122" font-size="58" font-weight="700" fill="url(#accent)" opacity="0">
        Jastin Simorangkir
        <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 20" to="0 0" dur="1.2s" fill="freeze"/>
      </text>

      <!-- Jabatan -->
      <text x="500" y="168" font-size="24" fill="#E2E8F0" letter-spacing="3" opacity="0">
        Junior Web &amp; Mobile Developer
        <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.8s" fill="freeze"/>
      </text>

      <!-- Tagline stack -->
      <text x="500" y="226" font-size="16" fill="#94A3B8" letter-spacing="2" opacity="0">
        Laravel  •  PHP  •  Flutter  •  Dart  •  MySQL
        <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.6s" fill="freeze"/>
      </text>
    </g>

    <!-- Garis aksen yang memanjang -->
    <rect x="420" y="188" width="0" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" from="0" to="160" dur="1s" begin="1.2s" fill="freeze"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
