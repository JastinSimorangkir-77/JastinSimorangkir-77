<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" role="img" aria-label="Terima kasih sudah berkunjung" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="160" fill="url(#bg)"/>

  <!-- Teks -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="52" font-size="26" font-weight="700" fill="url(#accent)" opacity="0">
      Terima kasih sudah berkunjung
      <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/>
    </text>
    <text x="500" y="78" font-size="14" fill="#94A3B8" letter-spacing="2" opacity="0">
      Let's build something great together
      <animate attributeName="opacity" from="0" to="1" dur="1.5s" begin="0.6s" fill="freeze"/>
    </text>
  </g>

  <!-- Gelombang belakang (lambat) -->
  <path d="M0 108 Q250 82 500 108 T1000 108 T1500 108 T2000 108 V160 H0 Z" fill="#38BDF8" opacity="0.18">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="14s" repeatCount="indefinite"/>
  </path>

  <!-- Gelombang tengah -->
  <path d="M0 122 Q250 142 500 122 T1000 122 T1500 122 T2000 122 V160 H0 Z" fill="#A78BFA" opacity="0.22">
    <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Gelombang depan (cepat) -->
  <path d="M0 138 Q250 118 500 138 T1000 138 T1500 138 T2000 138 V160 H0 Z" fill="#0F2027" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="7s" repeatCount="indefinite"/>
  </path>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
