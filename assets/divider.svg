<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="20" viewBox="0 0 1000 20" role="img" aria-label="Pemisah" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="9" width="1000" height="2" rx="1" fill="url(#line)"/>

  <!-- Titik cahaya yang bergerak -->
  <circle cy="10" r="9" fill="#38BDF8" opacity="0.25">
    <animate attributeName="cx" values="0;1000" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.25;0.25;0" keyTimes="0;0.1;0.9;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cy="10" r="4" fill="#A78BFA">
    <animate attributeName="cx" values="0;1000" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="5s" repeatCount="indefinite"/>
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
